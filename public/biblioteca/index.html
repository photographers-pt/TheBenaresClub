<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca — The Benares Club</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* ── Page layout ── */
    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-family);
      min-height: 100vh;
      margin: 0;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 6rem 2rem 8rem;
    }

    /* ── Section header ── */
    .section-eyebrow {
      display: block;
      font-family: var(--font-family);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .section-title {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 300;
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      color: var(--text-primary);
      line-height: 1.1;
      margin: 0 0 1.25rem;
    }

    .section-description {
      font-size: 1rem;
      color: var(--text-secondary);
      max-width: 540px;
      line-height: 1.65;
      margin: 0 0 4rem;
    }

    /* ── Books grid ── */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
      max-width: 680px;
    }

    @media (max-width: 540px) {
      .books-grid {
        gap: 1.25rem;
      }
    }

    /* ── Book card ── */
    .book-card {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .book-cover-link {
      display: block;
      text-decoration: none;
    }

    .book-cover-wrap {
      position: relative;
      aspect-ratio: 2 / 3;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: rgba(255, 248, 238, 0.04);
      backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(240, 232, 216, 0.08);
      transition: border-color 0.25s ease, transform 0.25s ease;
    }

    .book-cover-link:hover .book-cover-wrap {
      border-color: rgba(240, 232, 216, 0.22);
      transform: translateY(-3px);
    }

    .book-cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Coming-soon card ── */
    .book-cover-wrap.soon {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }

    .soon-label {
      font-family: var(--font-family);
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── Book meta ── */
    .book-meta {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .book-title {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
      font-size: 1rem;
      color: var(--text-primary);
      line-height: 1.3;
      margin: 0;
    }

    .book-author {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin: 0;
    }

    .book-meta.muted .book-title,
    .book-meta.muted .book-author {
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div id="grain"></div>
  <div id="header-container"></div>

  <main>
    <span class="section-eyebrow">01 · Biblioteca</span>
    <h1 class="section-title">Biblioteca</h1>
    <p class="section-description">
      Uma colecção de livros publicados pelo The Benares Club — entre ficção, fotografia e formas que resistem à classificação.
    </p>

    <div class="books-grid">

      <!-- Book 1: Inexistente -->
      <div class="book-card">
        <a class="book-cover-link" href="/biblioteca/inexistente/">
          <div class="book-cover-wrap">
            <img src="/biblioteca/inexistente/cover.jpg" alt="Capa de Inexistente" />
          </div>
        </a>
        <div class="book-meta">
          <p class="book-title">Inexistente</p>
          <p class="book-author">The Benares Club</p>
        </div>
      </div>

      <!-- Book 2: Artista -->
      <div class="book-card">
        <a class="book-cover-link" href="/biblioteca/artista/">
          <div class="book-cover-wrap">
            <img src="/biblioteca/artista/cover.jpg" alt="Capa de Artista" />
          </div>
        </a>
        <div class="book-meta">
          <p class="book-title">Artista</p>
          <p class="book-author">The Benares Club</p>
        </div>
      </div>

      <!-- Placeholder 3 -->
      <div class="book-card">
        <div class="book-cover-wrap soon">
          <span class="soon-label">Em breve</span>
        </div>
        <div class="book-meta muted">
          <p class="book-title">Em breve</p>
          <p class="book-author">&nbsp;</p>
        </div>
      </div>

      <!-- Placeholder 4 -->
      <div class="book-card">
        <div class="book-cover-wrap soon">
          <span class="soon-label">Em breve</span>
        </div>
        <div class="book-meta muted">
          <p class="book-title">Em breve</p>
          <p class="book-author">&nbsp;</p>
        </div>
      </div>

    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/shared.js"></script>
</body>
</html>
