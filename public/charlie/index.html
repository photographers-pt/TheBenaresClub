<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charlie Chaves — Portfolio</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { background: #0a0908; }

    .portfolio-hero {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: clamp(2rem, 6vw, 5rem) clamp(1.5rem, 6vw, 5rem) clamp(2rem, 5vw, 4rem);
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid rgba(240,232,216,0.07);
    }

    .portfolio-hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('/media/fototeca/full/nl1-12.jpg');
      background-size: cover;
      background-position: center top;
      filter: grayscale(100%) brightness(0.35);
    }

    .portfolio-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, #0a0908 0%, transparent 55%);
    }

    .portfolio-hero-content {
      position: relative;
      z-index: 1;
      max-width: 680px;
    }

    .portfolio-eyebrow {
      font-family: var(--font-family);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(240,232,216,0.4);
      margin-bottom: 1rem;
      display: block;
    }

    .portfolio-name {
      font-family: var(--font-serif);
      font-size: clamp(3rem, 8vw, 6.5rem);
      font-weight: 400;
      color: var(--text-primary);
      line-height: 1;
      margin: 0 0 0.75rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .portfolio-role {
      font-family: var(--font-family);
      font-size: 0.82rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(240,232,216,0.45);
    }

    /* Content */
    .portfolio-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: clamp(3rem, 6vw, 5rem) clamp(1.5rem, 6vw, 5rem) 8rem;
    }

    .section-eyebrow {
      font-family: var(--font-family);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(240,232,216,0.35);
      margin-bottom: 2rem;
      display: block;
    }

    .section-divider {
      border: none;
      border-top: 1px solid rgba(240,232,216,0.07);
      margin: 4rem 0;
    }

    /* Coming soon state */
    .coming-soon-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 320px;
      text-align: center;
      gap: 1rem;
    }

    .coming-soon-block .cs-label {
      font-family: var(--font-family);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(240,232,216,0.3);
    }

    .coming-soon-block .cs-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 400;
      color: rgba(240,232,216,0.15);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 0;
    }

    .coming-soon-block .cs-desc {
      font-family: var(--font-family);
      font-size: 0.85rem;
      color: rgba(240,232,216,0.25);
      max-width: 380px;
      line-height: 1.65;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-family);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(240,232,216,0.35);
      text-decoration: none;
      transition: color 0.2s;
      margin-bottom: 3rem;
      display: block;
    }
    .back-link:hover { color: var(--text-primary); }
  </style>
</head>
<body>
  <div id="grain"></div>
  <div id="header-container"></div>

  <main>
    <div class="portfolio-hero">
      <div class="portfolio-hero-bg"></div>
      <div class="portfolio-hero-content">
        <span class="portfolio-eyebrow">The Benares Club · Realizador</span>
        <h1 class="portfolio-name">Charlie Chaves</h1>
        <p class="portfolio-role">Director · Photographer · Founder</p>
      </div>
    </div>

    <div class="portfolio-content">
      <a href="/" class="back-link">← Club Benares</a>

      <div class="coming-soon-block">
        <span class="cs-label">Em construção</span>
        <h2 class="cs-title">Portfolio</h2>
        <p class="cs-desc">Esta página está a ser preparada. Em breve encontrarás aqui os projetos, filmes e trabalho fotográfico de Charlie Chaves.</p>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>
  <script src="/shared.js"></script>
</body>
</html>
