<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charlie Chaves · Fotografia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css" />
  <style>
    :root { --g: #5DA000; --neon: #39FF14; --ink: #111; --ink2: #555; --ink3: #999; --border: rgba(0,0,0,0.08); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #fff; color: var(--ink); font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; min-height: 100vh; }
    footer { background: #fff !important; border-top: 1px solid #e0e0e0 !important; }
    footer a { color: #aaa !important; }
    header { background-color: #fff !important; border-bottom: 1px solid #e0e0e0 !important; }
    nav { background-color: #f5f5f5 !important; border-bottom: 1px solid #e0e0e0 !important; }
    .nav-toggle { background: rgba(0,0,0,0.06) !important; border-color: rgba(0,0,0,0.15) !important; color: #111 !important; }
    .lang-btn { color: rgba(0,0,0,0.45) !important; border-color: rgba(0,0,0,0.18) !important; }
    #main-nav a { color: var(--g) !important; transition: color 0.15s; }
    #main-nav a:hover, #main-nav a.active { color: #2d5a00 !important; text-shadow: none !important; background: transparent !important; box-shadow: none !important; text-decoration: underline; text-underline-offset: 3px; }

    .ch-bar-nav { display: flex; align-items: center; padding: 0 2.5rem; background: #f5f5f5; border-bottom: 1px solid #e0e0e0; overflow-x: auto; scrollbar-width: none; }
    .ch-bar-nav::-webkit-scrollbar { display: none; }
    .ch-bar-nav-item { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; color: #777; padding: 1rem 1.2rem; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: color 0.15s, border-color 0.15s; display: inline-flex; align-items: center; }
    .ch-bar-nav-item:hover { color: #111; }
    .ch-bar-nav-item.active { color: var(--g); border-bottom-color: var(--g); font-weight: 600; }

    /* ── SECTION BAR ── */
    .photo-bar { display: flex; align-items: center; justify-content: space-between; padding: 0.35rem 2.5rem; border-bottom: 1px solid #e0e0e0; }
    .sec-label { font-size: 0.6rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--g); }
    .sec-desc { padding: 1.4rem 2.5rem 1.6rem; border-bottom: 1px solid #e0e0e0; max-width: 760px; }
    .sec-desc p { font-size: 0.82rem; line-height: 1.85; color: var(--g); font-style: italic; }
    .sec-count { font-size: 0.6rem; color: #999; letter-spacing: 0.08em; }

    /* ── COLLECTION GRID ── */
    .col-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      background: #e8e8e8;
    }

    /* ── COLLECTION CARD ── */
    .col-card {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      background: #ebebeb;
      min-height: 260px;
    }
    .col-card.tall  { grid-row: span 2; min-height: 524px; }
    .col-card.wide  { grid-column: span 2; }

    /* cover image — fills card */
    .col-cover {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease, filter 0.3s;
      filter: grayscale(10%);
    }
    .col-card:hover .col-cover { transform: scale(1.04); filter: grayscale(0); }

    /* placeholder shown when no image */
    .col-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ebebeb 0%, #e0e0e0 100%);
    }
    .col-placeholder svg { opacity: 0.2; }

    /* always-visible bottom info */
    .col-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 2.5rem 1.4rem 1.3rem;
      background: linear-gradient(transparent, rgba(0,0,0,0.75) 60%);
      transition: padding 0.25s;
    }
    .col-card:hover .col-info { padding-bottom: 1.8rem; }

    .col-cat {
      font-size: 0.52rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--g);
      margin-bottom: 0.4rem;
      display: block;
    }
    .col-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.35rem;
      letter-spacing: 0.04em;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 0.35rem;
    }
    .col-meta {
      font-size: 0.58rem;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.08em;
    }

    /* hover: "ver coleção" chip */
    .col-cta {
      position: absolute;
      top: 1rem; right: 1rem;
      font-size: 0.55rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--g);
      border: 1px solid var(--g);
      padding: 0.3rem 0.7rem;
      border-radius: 2px;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s, transform 0.2s;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
    }
    .col-card:hover .col-cta { opacity: 1; transform: translateY(0); }

    /* placeholder state: muted overlay */
    .col-card.placeholder-card .col-info { background: linear-gradient(transparent, rgba(0,0,0,0.45) 60%); }
    .col-card.placeholder-card .col-title,
    .col-card.placeholder-card .col-cat,
    .col-card.placeholder-card .col-meta { opacity: 0.4; }

    @media (max-width: 700px) {
      .col-grid { grid-template-columns: repeat(2, 1fr); }
      .col-card.tall { grid-row: span 1; min-height: 220px; }
      .col-card.wide { grid-column: span 2; }
    }
    @media (max-width: 420px) {
      .col-grid { grid-template-columns: 1fr; }
      .col-card.wide { grid-column: span 1; }
    }
  </style>
  <script src="/i18n-dict.js"></script>
  <script src="/i18n.js"></script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
  <div id="grain"></div>
  <div id="header-container"></div>
  <main>

    <nav class="ch-bar-nav">
      <a class="ch-bar-nav-item" href="/charlie/">Cinema</a>
      <a class="ch-bar-nav-item" href="/charlie/cineclub/">Cine Club</a>
      <a class="ch-bar-nav-item active" href="/charlie/photography/">Photography</a>
      <a class="ch-bar-nav-item" href="/charlie/videography/">Videography</a>
      <a class="ch-bar-nav-item" href="/charlie/daily/">Daily Life</a>
    </nav>

    <div class="photo-bar">
      <span class="sec-label">Coleções</span>
      <span class="sec-count" id="col-count"></span>
    </div>

    <div class="sec-desc">
      <p>O Blow-Up do Antonioni é um filme genial. E temos de admitir que o estilo de vida do fotógrafo era o paraíso. Então, bem, também gosto de tirar fotografias... capaz que um dia chego lá haha. -Charlie</p>
    </div>

    <div class="col-grid" id="col-grid"></div>

  </main>
  <div id="footer-container"></div>
  <script src="/shared.js"></script>
  <script>
    /* ── COLLECTIONS DATA ──────────────────────────────────────────
       Para adicionar uma coleção real:
         cover: '/Imagenes/Fotografia/nome-do-ficheiro.jpg'
       Deixar cover: null mostra o placeholder.
    ─────────────────────────────────────────────────────────────── */
    var COLLECTIONS = [
      { title: 'Nome do Cliente',   cat: 'Casamento',   year: '2025', count: null, cover: null, span: 'tall' },
      { title: 'Nome do Cliente',   cat: 'Retrato',     year: '2025', count: null, cover: null, span: '' },
      { title: 'Nome do Cliente',   cat: 'Editorial',   year: '2025', count: null, cover: null, span: '' },
      { title: 'Nome do Cliente',   cat: 'Corporativo', year: '2025', count: null, cover: null, span: 'wide' },
      { title: 'Nome do Cliente',   cat: 'Moda',        year: '2025', count: null, cover: null, span: '' },
      { title: 'Nome do Cliente',   cat: 'Eventos',     year: '2025', count: null, cover: null, span: 'tall' },
      { title: 'Nome do Cliente',   cat: 'Retrato',     year: '2025', count: null, cover: null, span: '' },
    ];

    function buildGrid() {
      var grid = document.getElementById('col-grid');
      var counter = document.getElementById('col-count');
      if (!grid) return;

      var total = COLLECTIONS.length;
      if (counter) counter.textContent = total + ' coleções';

      COLLECTIONS.forEach(function(col) {
        var card = document.createElement('div');
        card.className = 'col-card placeholder-card' + (col.span ? ' ' + col.span : '');

        var meta = col.year + (col.count ? ' · ' + col.count + ' fotos' : '');

        if (col.cover) {
          card.classList.remove('placeholder-card');
          var img = document.createElement('img');
          img.className = 'col-cover';
          img.src = col.cover;
          img.alt = col.title;
          img.loading = 'lazy';
          card.appendChild(img);
        } else {
          var ph = document.createElement('div');
          ph.className = 'col-placeholder';
          ph.innerHTML = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="12" cy="12" r="3.5"/><circle cx="17.5" cy="7.5" r="0.8" fill="#555"/></svg>';
          card.appendChild(ph);
        }

        var info = document.createElement('div');
        info.className = 'col-info';
        info.innerHTML =
          '<span class="col-cat">' + col.cat + '</span>' +
          '<p class="col-title">' + col.title + '</p>' +
          '<p class="col-meta">' + meta + '</p>';
        card.appendChild(info);

        var cta = document.createElement('span');
        cta.className = 'col-cta';
        cta.textContent = 'Ver coleção';
        card.appendChild(cta);

        grid.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      var logo = document.querySelector('#header-container img');
      if (logo) {
        logo.src = '/Imagenes/01 Banners/Club Benares - Charlie logo.png';
        logo.alt = 'Charlie Chaves · Club Benares';
        logo.style.height = '30px';
        logo.parentElement.href = '/charlie/home/';
      }
      var nav = document.querySelector('#main-nav ul');
      if (nav) {
        nav.innerHTML = [
          ['/charlie/',             'Filmografia'],
          ['/charlie/videography/', 'Videografia'],
          ['/charlie/photography/', 'Fotografia'],
          ['/charlie/cineclub/',    'Cine Club'],
          ['/charlie/contact/',     'Contacto'],
        ].map(function(item) {
          var active = window.location.pathname === item[0] ? 'active' : '';
          return '<li><a href="' + item[0] + '" class="' + active + '">' + item[1] + '</a></li>';
        }).join('');
      }
      buildGrid();
    });
  </script>
</body>
</html>
