<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinemateca — The Benares Club</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-family);
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    main {
      padding: 0 0 6rem;
    }

    /* Section headers */
    .section-header {
      margin-bottom: 2.5rem;
    }

    .section-eyebrow {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 0 0 0.6rem;
    }

    .section-title {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      font-weight: 300;
      line-height: 1.1;
      color: var(--text-primary);
      margin: 0;
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    section {
      padding: 5rem 0;
    }

    section + section {
      border-top: 1px solid var(--border);
    }

    /* Film shelf */
    .film-shelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.75rem;
    }

    .film-card {
      background: rgba(255, 248, 238, 0.04);
      backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(240, 232, 216, 0.08);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s ease;
    }

    .film-card:hover {
      border-color: rgba(240, 232, 216, 0.18);
    }

    .film-poster {
      aspect-ratio: 2 / 3;
      width: 100%;
      object-fit: cover;
      display: block;
      background: rgba(255, 248, 238, 0.03);
    }

    .film-poster-placeholder {
      aspect-ratio: 2 / 3;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 248, 238, 0.03);
      color: var(--text-muted);
      font-size: 2.5rem;
    }

    .film-info {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1;
    }

    .film-title {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--text-primary);
      margin: 0;
      line-height: 1.25;
    }

    .film-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin: 0;
    }

    .film-description {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.55;
      margin: 0.25rem 0 0.75rem;
    }

    .film-action {
      display: inline-block;
      margin-top: auto;
      padding: 0.6rem 1.25rem;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-primary);
      text-decoration: none;
      background: transparent;
      text-align: center;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .film-action:hover {
      background: rgba(255, 248, 238, 0.06);
      border-color: rgba(240, 232, 216, 0.35);
    }

    /* Coming Soon */
    .coming-soon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.25rem;
    }

    .coming-soon-card {
      background: rgba(255, 248, 238, 0.03);
      border: 1px solid rgba(240, 232, 216, 0.08);
      border-radius: var(--radius-md);
      padding: 1.5rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .coming-soon-title {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-primary);
      margin: 0;
    }

    .coming-soon-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin: 0;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border: 1px solid var(--border);
      border-radius: 99px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      width: fit-content;
    }

    /* Community Em Breve */
    .em-breve {
      text-align: center;
      padding: 4rem 2rem;
      background: rgba(255, 248, 238, 0.02);
      border: 1px solid rgba(240, 232, 216, 0.08);
      border-radius: var(--radius-lg);
    }

    .em-breve p {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.4rem;
      font-weight: 300;
      color: var(--text-secondary);
      margin: 0 0 0.75rem;
    }

    .em-breve span {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .film-shelf {
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
      }

      .coming-soon-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      section {
        padding: 3.5rem 0;
      }
    }
  </style>
</head>
<body>

  <div id="grain"></div>
  <div id="header-container"></div>
  <main>

  <div class="page-banner">
    <img src="/media/banners/cinemateca.png" alt="" class="page-banner-img">
    <div class="page-banner-title">
      <span class="page-banner-eyebrow">The Benares Club</span>
      <h1 class="page-banner-heading">Cinemateca</h1>
    </div>
  </div>

    <!-- Film Shelf -->
    <section id="films-section">
      <div class="container">
        <div class="section-header">
          <p class="section-eyebrow">Em exibição</p>
          <h2 class="section-title">Filmes disponíveis</h2>
        </div>
        <div class="film-shelf" id="film-shelf"></div>
      </div>
    </section>

    <!-- Coming Soon -->
    <section id="coming-soon-section">
      <div class="container">
        <div class="section-header">
          <p class="section-eyebrow">A chegar</p>
          <h2 class="section-title">Em breve na Cinemateca</h2>
        </div>
        <div class="coming-soon-grid" id="coming-soon-grid"></div>
      </div>
    </section>

    <!-- Community Films -->
    <section id="community-section">
      <div class="container">
        <div class="section-header">
          <p class="section-eyebrow">Comunidade</p>
          <h2 class="section-title">Filmes dos sócios</h2>
        </div>
        <div class="em-breve">
          <p>Em breve</p>
          <span>Os sócios poderão partilhar os seus filmes aqui.</span>
        </div>
      </div>
    </section>

  </main>

  <div id="footer-container"></div>

  <script>
    const films = [
      {
        title: "Pather Panchali",
        year: "1955",
        director: "Satyajit Ray",
        description: "A infância de Apu numa aldeia rural da Índia. Um retrato de beleza imperturbável.",
        poster: null,
        icon: "🎬"
      },
      {
        title: "In the Mood for Love",
        year: "2000",
        director: "Wong Kar-wai",
        description: "Dois vizinhos descobrem que os seus cônjuges têm um caso. Melancolia e desejo contidos.",
        poster: null,
        icon: "🌹"
      },
      {
        title: "Stalker",
        year: "1979",
        director: "Andrei Tarkovsky",
        description: "Uma jornada pela Zona — lugar de perigo e de esperança — em busca do quarto dos desejos.",
        poster: null,
        icon: "🌿"
      },
      {
        title: "Jeanne Dielman",
        year: "1975",
        director: "Chantal Akerman",
        description: "Três dias na vida de uma dona de casa. A rotina como linguagem cinematográfica radical.",
        poster: null,
        icon: "🕯️"
      },
      {
        title: "Yi Yi",
        year: "2000",
        director: "Edward Yang",
        description: "Uma família de Taipei atravessa um verão de mudanças. Três gerações, uma só ternura.",
        poster: null,
        icon: "🏙️"
      },
      {
        title: "La Dolce Vita",
        year: "1960",
        director: "Federico Fellini",
        description: "Um jornalista vaga pela Roma noturna em busca de sentido. Prazer e vazio em igual medida.",
        poster: null,
        icon: "✨"
      }
    ];

    const comingSoon = [
      { title: "Cleo de 5 à 7", year: "1962", director: "Agnès Varda" },
      { title: "A Margem do Paraíso", year: "2004", director: "Fatih Akin" },
      { title: "Amarcord", year: "1973", director: "Federico Fellini" },
      { title: "Tokyo Story", year: "1953", director: "Yasujirō Ozu" }
    ];

    // Render film shelf
    const shelf = document.getElementById('film-shelf');
    films.forEach(film => {
      const card = document.createElement('div');
      card.className = 'film-card';
      const posterHTML = film.poster
        ? `<img class="film-poster" src="${film.poster}" alt="${film.title}" loading="lazy">`
        : `<div class="film-poster-placeholder">${film.icon}</div>`;
      card.innerHTML = `
        ${posterHTML}
        <div class="film-info">
          <h3 class="film-title">${film.title}</h3>
          <p class="film-meta">${film.year} · ${film.director}</p>
          <p class="film-description">${film.description}</p>
          <a href="/cinemateca/" class="film-action">Ver na Cinemateca</a>
        </div>
      `;
      shelf.appendChild(card);
    });

    // Render coming soon
    const comingGrid = document.getElementById('coming-soon-grid');
    comingSoon.forEach(film => {
      const card = document.createElement('div');
      card.className = 'coming-soon-card';
      card.innerHTML = `
        <span class="badge">Em breve</span>
        <h4 class="coming-soon-title">${film.title}</h4>
        <p class="coming-soon-meta">${film.year} · ${film.director}</p>
      `;
      comingGrid.appendChild(card);
    });
  </script>

  <script src="/shared.js"></script>
</body>
</html>
