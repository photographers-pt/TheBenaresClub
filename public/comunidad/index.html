<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>.KO Lisboa — International Short-film Championship</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    :root {
      --bg-base:        #C8101F;
      --bg-surface:     #D4121F;
      --bg-elevated:    #E01525;
      --text-primary:   #ffffff;
      --text-secondary: rgba(255,255,255,0.75);
      --text-muted:     rgba(255,255,255,0.5);
      --border:         rgba(255,255,255,0.15);
      --border-strong:  rgba(255,255,255,0.35);
      --red:            #C8101F;
      --red-bright:     #FF1830;
    }

    body {
      background-color: var(--bg-base);
    }

    header, nav {
      background: rgba(160, 10, 18, 0.92) !important;
      border-color: rgba(255,255,255,0.12) !important;
    }

    footer {
      background-color: rgba(140, 8, 15, 0.95) !important;
      border-top-color: rgba(255,255,255,0.12) !important;
    }

    .ko-page {
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 2rem 8rem;
      position: relative;
      overflow: hidden;
    }

    .ko-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 55% at 50% 35%, rgba(255,255,255,0.08) 0%, transparent 65%),
        radial-gradient(ellipse 40% 40% at 80% 80%, rgba(0,0,0,0.15) 0%, transparent 60%);
      pointer-events: none;
    }

    .ko-eyebrow {
      font-family: var(--font-family);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      margin-bottom: 1.5rem;
      position: relative;
    }

    .ko-title {
      font-family: var(--font-serif);
      font-size: clamp(5rem, 22vw, 14rem);
      font-weight: 400;
      color: #ffffff;
      line-height: 0.9;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
      position: relative;
      text-shadow: 0 4px 40px rgba(0,0,0,0.25);
    }

    .ko-subtitle {
      font-family: var(--font-family);
      font-size: clamp(0.65rem, 1.4vw, 0.88rem);
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
      margin: 1.25rem 0 3.5rem;
      position: relative;
    }

    /* cooking-state overrides para fundo vermelho */
    .cooking-state-title { color: #fff; }
    .cooking-state-sub   { color: rgba(255,255,255,0.6); }
    .cooking-state-ig {
      color: rgba(255,255,255,0.75);
      border-color: rgba(255,255,255,0.3);
    }
    .cooking-state-ig:hover {
      color: #fff;
      border-color: #fff;
    }

  </style>
</head>
<body>
  <div id="grain"></div>
  <div id="header-container"></div>

  <main>
    <div class="ko-page">
      <span class="ko-eyebrow">The Benares Club presents</span>
      <h1 class="ko-title">.KO</h1>
      <p class="ko-subtitle">Lisboa International Short-film Championship</p>
      <div class="cooking-state">
        <span class="cooking-state-icon">🍳</span>
        <p class="cooking-state-title">Cooking in progress</p>
        <p class="cooking-state-sub">Estamos a preparar o ring.<br>Segue-nos no Instagram para não perderes nenhum anúncio.</p>
        <a class="cooking-state-ig" href="https://www.instagram.com/thebenaresclub" target="_blank" rel="noopener">
          <i class="fab fa-instagram"></i> @thebenaresclub
        </a>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>
  <script src="/shared.js"></script>
</body>
</html>
