<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>.KO Lisboa — International Short-film Championship</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    :root {
      --bg-base:        #0B0101;
      --bg-surface:     #150303;
      --bg-elevated:    #1E0404;
      --text-primary:   #FFE8E8;
      --text-secondary: #D4A0A0;
      --text-muted:     #8A5050;
      --border:         rgba(200, 16, 31, 0.18);
      --border-strong:  rgba(200, 16, 31, 0.45);
      --glass-blur:     blur(12px);
      --red:            #C8101F;
      --red-bright:     #FF1830;
      --red-dim:        rgba(200, 16, 31, 0.12);
    }

    body {
      background-color: var(--bg-base);
    }

    header, nav {
      background: rgba(11, 1, 1, 0.85) !important;
      border-color: var(--border) !important;
    }

    footer {
      border-top-color: var(--border) !important;
    }

    .ko-page {
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 2rem 8rem;
      position: relative;
      overflow: hidden;
    }

    .ko-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 50% 40%, rgba(200, 16, 31, 0.18) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 20% 80%, rgba(200, 16, 31, 0.07) 0%, transparent 60%);
      pointer-events: none;
    }

    .ko-eyebrow {
      font-family: var(--font-family);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--red-bright);
      margin-bottom: 1.5rem;
      position: relative;
    }

    .ko-title {
      font-family: var(--font-serif);
      font-size: clamp(5rem, 22vw, 14rem);
      font-weight: 400;
      color: var(--red-bright);
      line-height: 0.9;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
      position: relative;
      text-shadow: 0 0 80px rgba(255, 24, 48, 0.3);
    }

    .ko-subtitle {
      font-family: var(--font-family);
      font-size: clamp(0.65rem, 1.4vw, 0.88rem);
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin: 1.25rem 0 3.5rem;
      position: relative;
    }

    .coming-soon {
      font-family: var(--font-family);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-muted);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 0.7rem 1.75rem;
      position: relative;
    }

    .social-hint {
      margin-top: 2.5rem;
      position: relative;
    }

    .social-hint a {
      font-family: var(--font-family);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.2s;
    }

    .social-hint a:hover {
      color: var(--red-bright);
    }
  </style>
</head>
<body>
  <div id="grain"></div>
  <div id="header-container"></div>

  <main>
    <div class="ko-page">
      <span class="ko-eyebrow">The Benares Club presents</span>
      <h1 class="ko-title">.KO</h1>
      <p class="ko-subtitle">Lisboa International Short-film Championship</p>
      <span class="coming-soon">Coming Soon</span>
      <div class="social-hint">
        <a href="https://www.instagram.com/thebenaresclub" target="_blank" rel="noopener">
          <i class="fab fa-instagram"></i>
          Segue-nos para as últimas novidades
        </a>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>
  <script src="/shared.js"></script>
</body>
</html>
