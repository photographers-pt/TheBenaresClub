<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contactos — The Benares Club</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .contactos-section {
      padding: 6rem 2rem 8rem;
      max-width: 860px;
      margin: 0 auto;
    }

    .section-label {
      font-family: var(--font-family);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .section-title {
      font-family: var(--font-family);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-style: normal;
      font-size: clamp(3.0rem, 6.0vw, 4.5rem);
      font-weight: 300;
      color: var(--text-primary);
      line-height: 1.1;
      margin: 0 0 3.5rem;
    }

    .contacts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .contact-card {
      background: rgba(255, 248, 238, 0.04);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 2rem 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      text-decoration: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .contact-card:hover {
      border-color: var(--border-strong);
      background: rgba(255, 248, 238, 0.07);
    }

    .contact-card .card-icon {
      font-size: 1.4rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      line-height: 1;
    }

    .contact-card .card-label {
      font-family: var(--font-family);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .contact-card .card-value {
      font-family: var(--font-family);
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-primary);
      word-break: break-all;
    }

    @media (max-width: 480px) {
      .contactos-section {
        padding: 4rem 1.25rem 6rem;
      }

      .contacts-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div id="grain"></div>
  <div id="header-container"></div>

  <main>
  <div class="page-banner">
    <img src="/media/banners/contactos.png" alt="" class="page-banner-img">
    <div class="page-banner-title">
      <span class="page-banner-eyebrow">01 · Contactos</span>
      <h1 class="page-banner-heading">Fala Connosco</h1>
    </div>
  </div>
    <section class="contactos-section">

      <div class="contacts-grid">

        <a class="contact-card" href="mailto:charlie@thebenaresclub.com">
          <span class="card-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
          </span>
          <span class="card-label">Email</span>
          <span class="card-value">charlie@thebenaresclub.com</span>
        </a>

        <a class="contact-card" href="https://www.instagram.com/thebenaresclub" target="_blank" rel="noopener noreferrer">
          <span class="card-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
            </svg>
          </span>
          <span class="card-label">Instagram</span>
          <span class="card-value">@thebenaresclub</span>
        </a>

      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script src="/shared.js"></script>
</body>
</html>
