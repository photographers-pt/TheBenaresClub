<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fototeca — The Benares Club</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    main { /* no max-width — banner full width */ }

    /* ── Event section ── */
    .event-section {
      padding: 4rem 0 2rem;
      border-top: 1px solid var(--border);
    }

    .event-section:first-of-type {
      border-top: none;
      padding-top: 3rem;
    }

    .event-header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 2rem;
      display: flex;
      align-items: baseline;
      gap: 1.5rem;
    }

    .event-eyebrow {
      font-family: var(--font-family);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .event-title {
      font-family: var(--font-family);
      font-size: clamp(1.3rem, 2.5vw, 1.9rem);
      font-weight: 300;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-primary);
      margin: 0;
    }

    .event-date {
      font-family: var(--font-family);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-left: auto;
      white-space: nowrap;
    }

    /* ── Photo grid ── */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 240px;
      gap: 2px;
    }

    .photo-item {
      position: relative;
      overflow: hidden;
      background: rgba(255, 248, 238, 0.03);
      cursor: pointer;
    }

    .photo-item.tall  { grid-row: span 2; }
    .photo-item.wide  { grid-column: span 2; }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease, opacity 0.3s ease;
      opacity: 0.88;
    }

    .photo-item:hover img {
      transform: scale(1.04);
      opacity: 1;
    }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 900;
      background: rgba(8, 7, 6, 0.97);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox-img-wrap {
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(0.97);
      transition: transform 0.3s ease;
    }

    .lightbox.open .lightbox-img-wrap {
      transform: scale(1);
    }

    .lightbox-img-wrap img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      display: block;
    }

    .lightbox-close {
      position: fixed;
      top: 1.5rem;
      right: 1.75rem;
      background: transparent;
      border: none;
      color: rgba(240, 232, 216, 0.35);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
      z-index: 1;
    }

    .lightbox-close:hover { color: var(--text-primary); }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: rgba(240, 232, 216, 0.25);
      font-size: 2rem;
      cursor: pointer;
      padding: 1rem;
      line-height: 1;
      transition: color 0.2s;
    }

    .lightbox-nav:hover { color: var(--text-primary); }
    .lightbox-prev { left: 0.5rem; }
    .lightbox-next { right: 0.5rem; }

    .lightbox-caption {
      position: fixed;
      bottom: 1.75rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-family);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      white-space: nowrap;
      pointer-events: none;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .photo-grid {
        grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: 200px;
      }
    }

    @media (max-width: 600px) {
      .photo-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 160px;
      }
      .photo-item.wide { grid-column: span 1; }
      .event-header { flex-wrap: wrap; gap: 0.5rem; }
      .event-date { margin-left: 0; }
      .lightbox-nav { display: none; }
    }
  </style>
</head>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lbClose" aria-label="Fechar">&#x2715;</button>
    <button class="lightbox-nav lightbox-prev" id="lbPrev" aria-label="Anterior">&#8592;</button>
    <div class="lightbox-img-wrap" id="lbImgWrap"></div>
    <button class="lightbox-nav lightbox-next" id="lbNext" aria-label="Seguinte">&#8594;</button>
    <div class="lightbox-caption" id="lbCaption"></div>
  </div>

  <div id="footer-container"></div>

  <script>
    const items = Array.from(document.querySelectorAll('.photo-item'));
    const lb      = document.getElementById('lightbox');
    const lbWrap  = document.getElementById('lbImgWrap');
    const lbCap   = document.getElementById('lbCaption');
    const lbClose = document.getElementById('lbClose');
    const lbPrev  = document.getElementById('lbPrev');
    const lbNext  = document.getElementById('lbNext');
    let cur = 0;

    function show(i) {
      cur = i;
      const item = items[i];
      const src = item.dataset.src;
      lbWrap.innerHTML = '';
      const img = new Image();
      img.src = src;
      lbWrap.appendChild(img);
      lbCap.textContent = item.dataset.caption || '';
      lbPrev.style.opacity = i === 0 ? '0.12' : '0.25';
      lbNext.style.opacity = i === items.length - 1 ? '0.12' : '0.25';
    }

    function open(i)  { show(i); lb.classList.add('open'); document.body.style.overflow = 'hidden'; }
    function close()  { lb.classList.remove('open'); document.body.style.overflow = ''; }

    items.forEach(function(item, i) { item.addEventListener('click', function() { open(i); }); });
    lbClose.addEventListener('click', close);
    lb.addEventListener('click', function(e) { if (e.target === lb) close(); });
    lbPrev.addEventListener('click', function(e) { e.stopPropagation(); if (cur > 0) show(cur - 1); });
    lbNext.addEventListener('click', function(e) { e.stopPropagation(); if (cur < items.length - 1) show(cur + 1); });
    document.addEventListener('keydown', function(e) {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft'  && cur > 0) show(cur - 1);
      if (e.key === 'ArrowRight' && cur < items.length - 1) show(cur + 1);
    });
  </script>

  <script src="/shared.js"></script>

</html>
