<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercado — The Benares Club</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* ── Filter bar (pills + cart) ── */
    .filter-bar {
      padding: 0 48px 48px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }
    .filter-bar-spacer {
      flex: 1;
      min-width: 24px;
    }
    .filter-pill {
      font-family: var(--font-family);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: 100px;
      padding: 8px 18px;
      cursor: pointer;
      transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }
    .filter-pill:hover {
      color: var(--text-primary);
      border-color: rgba(240, 232, 216, 0.35);
    }
    .filter-pill.active {
      background: rgba(240, 232, 216, 0.12);
      border-color: rgba(240, 232, 216, 0.35);
      color: var(--text-primary);
    }

    /* ── Cart trigger (inline with filter bar) ── */
    .cart-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-family);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-primary);
      background: rgba(255, 248, 238, 0.06);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-strong);
      border-radius: 100px;
      padding: 8px 18px;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
      white-space: nowrap;
    }
    .cart-trigger:hover {
      background: rgba(255, 248, 238, 0.10);
      border-color: rgba(240, 232, 216, 0.3);
    }
    .cart-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(240, 232, 216, 0.15);
      font-size: 10px;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }
    .cart-count[data-count="0"] {
      opacity: 0.4;
    }

    /* ── Product grid ── */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      padding: 0 48px 80px;
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ── Product card ── */
    .product-card {
      background: rgba(255, 248, 238, 0.04);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.25s ease, background 0.25s ease;
    }
    .product-card:hover {
      border-color: var(--border-strong);
      background: rgba(255, 248, 238, 0.07);
    }
    .product-card-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: rgba(255, 248, 238, 0.03);
    }
    .product-card-image-placeholder {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: rgba(255, 248, 238, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-family);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-style: normal;
      font-size: 24px;
      color: var(--text-muted);
    }
    .product-card-body {
      padding: 20px 24px 24px;
    }
    .product-card-category {
      font-family: var(--font-family);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .product-card-name {
      font-family: var(--font-family);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-style: normal;
      font-size: 20px;
      font-weight: 300;
      color: var(--text-primary);
      line-height: 1.25;
      margin: 0 0 6px;
    }
    .product-card-subtitle {
      font-family: var(--font-family);
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .product-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .product-price {
      font-family: var(--font-family);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .product-price .original {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-muted);
      text-decoration: line-through;
      margin-right: 6px;
    }
    .product-swatches {
      display: flex;
      gap: 6px;
    }
    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(240, 232, 216, 0.2);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .swatch:hover {
      transform: scale(1.15);
      border-color: rgba(240, 232, 216, 0.5);
    }
    .swatch.sold-out {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .swatch.sold-out:hover {
      transform: none;
    }
    .btn-add {
      font-family: var(--font-family);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-primary);
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
      white-space: nowrap;
    }
    .btn-add:hover {
      background: rgba(240, 232, 216, 0.08);
      border-color: rgba(240, 232, 216, 0.35);
    }
    .btn-add.added {
      opacity: 0.5;
    }
    .product-card.hidden {
      display: none;
    }

    /* ── Empty state ── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
      font-family: var(--font-family);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-style: normal;
      font-size: 22px;
    }

    /* ── Cart Drawer ── */
    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 7, 6, 0.6);
      z-index: 900;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .cart-overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    .cart-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(440px, 100vw);
      background: rgba(12, 11, 10, 0.96);
      backdrop-filter: var(--glass-blur);
      border-left: 1px solid var(--border-strong);
      z-index: 901;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .cart-drawer.open {
      transform: translateX(0);
    }
    .cart-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 32px;
      border-bottom: 1px solid var(--border);
    }
    .cart-drawer-title {
      font-family: var(--font-family);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-style: normal;
      font-size: 22px;
      font-weight: 300;
      color: var(--text-primary);
    }
    .cart-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      transition: color 0.2s ease;
    }
    .cart-close:hover {
      color: var(--text-primary);
    }
    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .cart-items::-webkit-scrollbar {
      width: 4px;
    }
    .cart-items::-webkit-scrollbar-track {
      background: transparent;
    }
    .cart-items::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 2px;
    }
    .cart-empty {
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
      font-family: var(--font-family);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-style: normal;
      font-size: 18px;
    }
    .cart-item {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .cart-item-image {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      flex-shrink: 0;
      background: rgba(255, 248, 238, 0.04);
      border: 1px solid var(--border);
    }
    .cart-item-placeholder {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      background: rgba(255, 248, 238, 0.04);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--text-muted);
    }
    .cart-item-info {
      flex: 1;
      min-width: 0;
    }
    .cart-item-name {
      font-family: var(--font-family);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-style: normal;
      font-size: 15px;
      font-weight: 300;
      color: var(--text-primary);
      margin-bottom: 3px;
    }
    .cart-item-variant {
      font-family: var(--font-family);
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .qty-btn {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .qty-btn:hover {
      background: rgba(240, 232, 216, 0.08);
      color: var(--text-primary);
    }
    .qty-display {
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      min-width: 20px;
      text-align: center;
    }
    .cart-item-remove {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      padding: 0;
      font-family: var(--font-family);
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: color 0.15s ease;
    }
    .cart-item-remove:hover {
      color: var(--text-secondary);
    }
    .cart-item-price {
      font-family: var(--font-family);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      flex-shrink: 0;
    }
    .cart-footer {
      padding: 24px 32px;
      border-top: 1px solid var(--border);
    }
    .cart-subtotal {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .cart-subtotal-label {
      font-family: var(--font-family);
      font-size: 13px;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .cart-subtotal-amount {
      font-family: var(--font-family);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-style: normal;
      font-size: 22px;
      font-weight: 300;
      color: var(--text-primary);
    }
    .btn-checkout {
      display: block;
      width: 100%;
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--bg-base);
      background: var(--text-primary);
      border: none;
      border-radius: var(--radius-sm);
      padding: 14px 24px;
      cursor: pointer;
      transition: opacity 0.2s ease;
      margin-bottom: 12px;
    }
    .btn-checkout:hover {
      opacity: 0.88;
    }
    .btn-checkout:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .cart-note {
      font-family: var(--font-family);
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }

    /* ── Product Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 7, 6, 0.75);
      z-index: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    .modal-panel {
      background: rgba(14, 13, 12, 0.97);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 860px;
      max-height: 90vh;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      transform: translateY(12px);
      transition: transform 0.3s ease;
    }
    .modal-overlay.open .modal-panel {
      transform: translateY(0);
    }
    .modal-panel::-webkit-scrollbar {
      width: 4px;
    }
    .modal-panel::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 2px;
    }
    .modal-image-col {
      border-right: 1px solid var(--border);
    }
    .modal-image {
      width: 100%;
      height: 100%;
      min-height: 360px;
      object-fit: cover;
      display: block;
      border-radius: var(--radius-lg) 0 0 var(--radius-lg);
    }
    .modal-image-placeholder {
      width: 100%;
      min-height: 360px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 248, 238, 0.03);
      font-family: var(--font-family);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-style: normal;
      font-size: 40px;
      color: var(--text-muted);
      border-radius: var(--radius-lg) 0 0 var(--radius-lg);
    }
    .modal-info-col {
      padding: 40px;
      display: flex;
      flex-direction: column;
    }
    .modal-close {
      align-self: flex-end;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      margin-bottom: 24px;
      transition: color 0.2s ease;
    }
    .modal-close:hover {
      color: var(--text-primary);
    }
    .modal-category {
      font-family: var(--font-family);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .modal-name {
      font-family: var(--font-family);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-style: normal;
      font-size: 28px;
      font-weight: 300;
      color: var(--text-primary);
      line-height: 1.2;
      margin: 0 0 8px;
    }
    .modal-subtitle {
      font-family: var(--font-family);
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .modal-price {
      font-family: var(--font-family);
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 24px;
    }
    .modal-price .original {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-muted);
      text-decoration: line-through;
      margin-right: 8px;
    }

    /* ── Variant selectors ── */
    .modal-section-label {
      font-family: var(--font-family);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .modal-swatches {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .modal-swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s ease, outline-color 0.15s ease;
      outline: 2px solid transparent;
      outline-offset: 3px;
    }
    .modal-swatch:hover {
      transform: scale(1.1);
    }
    .modal-swatch.selected {
      outline-color: rgba(240, 232, 216, 0.5);
    }
    .modal-swatch.sold-out {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .modal-swatch.sold-out:hover {
      transform: none;
    }
    .modal-sizes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .size-btn {
      font-family: var(--font-family);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 6px 14px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .size-btn:hover {
      color: var(--text-primary);
      border-color: rgba(240, 232, 216, 0.35);
    }
    .size-btn.selected {
      background: rgba(240, 232, 216, 0.1);
      border-color: rgba(240, 232, 216, 0.4);
      color: var(--text-primary);
    }
    .size-btn.sold-out {
      opacity: 0.3;
      cursor: not-allowed;
      text-decoration: line-through;
    }
    .modal-add-btn {
      display: block;
      width: 100%;
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--bg-base);
      background: var(--text-primary);
      border: none;
      border-radius: var(--radius-sm);
      padding: 14px 24px;
      cursor: pointer;
      transition: opacity 0.2s ease;
      margin-bottom: 20px;
    }
    .modal-add-btn:hover {
      opacity: 0.88;
    }
    .modal-add-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* ── Specs — plain definition list ── */
    .modal-specs {
      border-top: 1px solid var(--border);
      padding-top: 20px;
      margin-top: auto;
    }
    .modal-specs-title {
      font-family: var(--font-family);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .specs-list {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 20px;
      margin: 0;
    }
    .specs-list dt {
      font-family: var(--font-family);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .specs-list dd {
      font-family: var(--font-family);
      font-size: 12px;
      color: var(--text-secondary);
      margin: 0;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .filter-bar {
        padding: 0 24px 36px;
      }
      .product-grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        padding: 0 24px 60px;
        gap: 16px;
      }
      .modal-panel {
        grid-template-columns: 1fr;
        max-width: 500px;
      }
      .modal-image-col {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .modal-image,
      .modal-image-placeholder {
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        min-height: 240px;
      }
      .modal-info-col {
        padding: 28px 24px;
      }
    }
    @media (max-width: 480px) {
      .product-grid {
        grid-template-columns: 1fr;
      }
      .cart-drawer {
        width: 100vw;
      }
    }
  </style>
</head>
<body>
  <div id="grain"></div>
  <div id="header-container"></div>

  <main>
  <div class="page-banner">
    <img src="/media/banners/mercado.png" alt="" class="page-banner-img">
    <div class="page-banner-title">
      <span class="page-banner-eyebrow">The Benares Club</span>
      <h1 class="page-banner-heading">Mercado</h1>
    </div>
  </div>

    <nav class="filter-bar" id="filterBar" aria-label="Categorias de produto">
      <button class="filter-pill active" data-filter="all">Tudo</button>
      <div class="filter-bar-spacer"></div>
      <button class="cart-trigger" id="cartTrigger" aria-label="Abrir carrinho">
        <span>Carrinho</span>
        <span class="cart-count" id="cartCountBadge" data-count="0">0</span>
      </button>
    </nav>

    <div class="product-grid" id="productGrid"></div>
  </main>

  <!-- Cart Drawer -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer" aria-label="Carrinho">
    <div class="cart-drawer-header">
      <span class="cart-drawer-title">Carrinho</span>
      <button class="cart-close" id="cartClose" aria-label="Fechar carrinho">&#x2715;</button>
    </div>
    <div class="cart-items" id="cartItemsContainer">
      <div class="cart-empty">O carrinho está vazio.</div>
    </div>
    <div class="cart-footer">
      <div class="cart-subtotal">
        <span class="cart-subtotal-label">Subtotal</span>

      </div>
      <button class="btn-checkout" id="checkoutBtn" disabled>Finalizar compra</button>

    </div>
  </aside>

  <!-- Product Detail Modal -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalProductName">
    <div class="modal-panel" id="modalPanel">
      <div class="modal-image-col" id="modalImageCol">
        <div class="modal-image-placeholder" id="modalImagePlaceholder">&#x2014;</div>
      </div>
      <div class="modal-info-col">
        <button class="modal-close" id="modalClose" aria-label="Fechar">&#x2715;</button>
        <div class="modal-category" id="modalCategory"></div>
        <h2 class="modal-name" id="modalProductName"></h2>
        <p class="modal-subtitle" id="modalSubtitle"></p>
        <div class="modal-price" id="modalPrice"></div>

        <div id="modalSwatchSection" style="display:none">
          <div class="modal-section-label">Cor</div>
          <div class="modal-swatches" id="modalSwatches"></div>
        </div>

        <div id="modalSizeSection" style="display:none">
          <div class="modal-section-label">Tamanho</div>
          <div class="modal-sizes" id="modalSizes"></div>
        </div>

        <button class="modal-add-btn" id="modalAddBtn">Adicionar ao carrinho</button>

        <div class="modal-specs" id="modalSpecsContainer" style="display:none">
          <div class="modal-specs-title">Especificações</div>
          <dl class="specs-list" id="modalSpecsList"></dl>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script>
  /* ── Products ── */
  const PRODUCTS = [
    {

    {

      colors: [
        { label: 'Natural Linen', hex: '#c8bfa8' },
        { label: 'Charcoal', hex: '#3c3c3c' },
      ],
      sizes: ['A3 / 30×40 cm', 'A2 / 50×70 cm', 'A1 / 70×100 cm'],
      soldOutColors: [],

      specs: [
        ['Material', 'Acid-free linen'],
        ['Closure', 'Linen tie'],
        ['Interior', 'Cotton interleaf'],
        ['Archival', 'Yes, pH neutral'],
      ],
    },
    {
      id: 'p007',
      name: 'Annual Membership',
      subtitle: 'Full access to the archive, print-credit scheme, and member events for 12 months.',
      category: 'membership',
      price: 180,
      originalPrice: null,
      image: null,
      emoji: '✦',
      colors: null,
      sizes: null,
      soldOutColors: [],
      soldOutSizes: [],
      specs: [
        ['Duration', '12 months from activation'],
        ['Archive access', 'Full, high-resolution'],
        ['Print credits', '2 × 50% discount codes'],
        ['Events', 'Members-only previews'],
        ['Renewal', 'Manual or auto'],
      ],
    },
    {
      id: 'p008',
      name: 'Gift Card',
      subtitle: 'Delivered by email. Valid on all products. No expiry.',
      category: 'membership',
      price: 50,
      originalPrice: null,
      image: null,
      emoji: '✉',
      colors: null,
      sizes: ['€50', '€100', '€200', '€500'],
      soldOutColors: [],
      soldOutSizes: [],
      specs: [
        ['Delivery', 'Email, instant'],
        ['Validity', 'No expiry'],
        ['Redemption', 'One or multiple orders'],
      ],
    },
  ];

  /* ── State ── */
  let cart = [];
  let activeFilter = 'all';
  let modalProduct = null;
  let modalSelectedColor = null;
  let modalSelectedSize = null;

  /* ── DOM refs ── */
  const productGrid    = document.getElementById('productGrid');
  const filterBar      = document.getElementById('filterBar');
  const cartOverlay    = document.getElementById('cartOverlay');
  const cartDrawer     = document.getElementById('cartDrawer');
  const cartClose      = document.getElementById('cartClose');
  const cartTrigger    = document.getElementById('cartTrigger');
  const cartCountBadge = document.getElementById('cartCountBadge');
  const cartItems      = document.getElementById('cartItemsContainer');
  const cartSubtotal   = document.getElementById('cartSubtotal');
  const checkoutBtn    = document.getElementById('checkoutBtn');
  const modalOverlay   = document.getElementById('modalOverlay');
  const modalClose     = document.getElementById('modalClose');
  const modalAddBtn    = document.getElementById('modalAddBtn');

  /* ── Helpers ── */
  function formatPrice(amount) {
    return '\u20ac' + amount.toLocaleString('en-IE');
  }

  const CAT_LABELS = { prints: 'Impressões', books: 'Livros', objects: 'Objectos', membership: 'Membros' };

  /* ── Filters ── */
  function buildFilters() {
    const categories = [...new Set(PRODUCTS.map(p => p.category))];
    // Insert pills before the spacer/cart button
    const spacer = filterBar.querySelector('.filter-bar-spacer');
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'filter-pill';
      btn.dataset.filter = cat;
      btn.textContent = CAT_LABELS[cat] || cat.charAt(0).toUpperCase() + cat.slice(1);
      filterBar.insertBefore(btn, spacer);
    });
    filterBar.addEventListener('click', e => {
      const pill = e.target.closest('.filter-pill');
      if (!pill) return;
      activeFilter = pill.dataset.filter;
      filterBar.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      renderProducts();
    });
  }

  /* ── Product grid ── */
  function renderProducts() {
    productGrid.innerHTML = '';
    const filtered = activeFilter === 'all'
      ? PRODUCTS
      : PRODUCTS.filter(p => p.category === activeFilter);

    if (filtered.length === 0) {
      productGrid.innerHTML = '<div class="empty-state">Nada aqui ainda.</div>';
      return;
    }

    filtered.forEach(product => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.dataset.id = product.id;

      const imgHtml = product.image
        ? `<img class="product-card-image" src="${product.image}" alt="${product.name}" loading="lazy">`
        : `<div class="product-card-image-placeholder">${product.emoji || '\u2014'}</div>`;

      const swatchHtml = product.colors && product.colors.length > 0
        ? `<div class="product-swatches">${product.colors.map(c =>
            `<span class="swatch${product.soldOutColors.includes(c.label) ? ' sold-out' : ''}"
              style="background:${c.hex}" title="${c.label}"></span>`
          ).join('')}</div>`
        : '';

      const priceHtml = product.originalPrice
        ? `<span class="original">${formatPrice(product.originalPrice)}</span>${formatPrice(product.price)}`
        : formatPrice(product.price);

      card.innerHTML = `
        ${imgHtml}
        <div class="product-card-body">
          <div class="product-card-category">${CAT_LABELS[product.category] || product.category}</div>
          <h3 class="product-card-name">${product.name}</h3>
          <p class="product-card-subtitle">${product.subtitle}</p>
          <div class="product-card-footer">
            <div class="product-price">${priceHtml}</div>
            ${swatchHtml}
            <button class="btn-add" data-id="${product.id}">Ver</button>
          </div>
        </div>
      `;

      card.addEventListener('click', () => openModal(product));
      productGrid.appendChild(card);
    });
  }

  /* ── Cart ── */
  function cartKey(product, color, size) {
    return [product.id, color || '', size || ''].join('::');
  }

  function addToCart(product, color, size) {
    const key = cartKey(product, color, size);
    const existing = cart.find(i => i.key === key);
    if (existing) {
      existing.qty += 1;
    } else {
      cart.push({ key, product, color, size, qty: 1 });
    }
    updateCartUI();
  }

  function removeFromCart(key) {
    cart = cart.filter(i => i.key !== key);
    updateCartUI();
  }

  function changeQty(key, delta) {
    const item = cart.find(i => i.key === key);
    if (!item) return;
    item.qty = Math.max(0, item.qty + delta);
    if (item.qty === 0) removeFromCart(key);
    else updateCartUI();
  }

  function updateCartUI() {
    const totalQty = cart.reduce((s, i) => s + i.qty, 0);
    cartCountBadge.textContent = totalQty;
    cartCountBadge.dataset.count = totalQty;

    if (cart.length === 0) {
      cartItems.innerHTML = '<div class="cart-empty">O carrinho está vazio.</div>';
      checkoutBtn.disabled = true;
      cartSubtotal.textContent = '\u20ac0';
      return;
    }

    checkoutBtn.disabled = false;
    const total = cart.reduce((s, i) => s + i.product.price * i.qty, 0);
    cartSubtotal.textContent = formatPrice(total);

    cartItems.innerHTML = '';
    cart.forEach(item => {
      const el = document.createElement('div');
      el.className = 'cart-item';
      const imgHtml = item.product.image
        ? `<img class="cart-item-image" src="${item.product.image}" alt="${item.product.name}">`
        : `<div class="cart-item-placeholder">${item.product.emoji || '\u2014'}</div>`;
      const variantParts = [item.color, item.size].filter(Boolean);
      el.innerHTML = `
        ${imgHtml}
        <div class="cart-item-info">
          <div class="cart-item-name">${item.product.name}</div>
          ${variantParts.length ? `<div class="cart-item-variant">${variantParts.join(' \u00b7 ')}</div>` : ''}
          <div class="cart-item-controls">
            <button class="qty-btn" data-key="${item.key}" data-delta="-1">\u2212</button>
            <span class="qty-display">${item.qty}</span>
            <button class="qty-btn" data-key="${item.key}" data-delta="1">+</button>
            <button class="cart-item-remove" data-key="${item.key}">Remover</button>
          </div>
        </div>
        <div class="cart-item-price">${formatPrice(item.product.price * item.qty)}</div>
      `;
      cartItems.appendChild(el);
    });

    cartItems.querySelectorAll('.qty-btn').forEach(btn => {
      btn.addEventListener('click', () => changeQty(btn.dataset.key, parseInt(btn.dataset.delta, 10)));
    });
    cartItems.querySelectorAll('.cart-item-remove').forEach(btn => {
      btn.addEventListener('click', () => removeFromCart(btn.dataset.key));
    });
  }

  function openCart() {
    cartDrawer.classList.add('open');
    cartOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeCart() {
    cartDrawer.classList.remove('open');
    cartOverlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  cartTrigger.addEventListener('click', openCart);
  cartClose.addEventListener('click', closeCart);
  cartOverlay.addEventListener('click', closeCart);

  /* ── Modal ── */
  function openModal(product) {
    modalProduct = product;
    modalSelectedColor = product.colors && product.colors.length > 0 ? product.colors[0].label : null;
    modalSelectedSize  = product.sizes  && product.sizes.length  > 0 ? product.sizes[0]        : null;

    document.getElementById('modalCategory').textContent = product.category;
    document.getElementById('modalProductName').textContent = product.name;
    document.getElementById('modalSubtitle').textContent = product.subtitle;

    const priceEl = document.getElementById('modalPrice');
    priceEl.innerHTML = product.originalPrice
      ? `<span class="original">${formatPrice(product.originalPrice)}</span>${formatPrice(product.price)}`
      : formatPrice(product.price);

    // Image
    const imgCol = document.getElementById('modalImageCol');
    if (product.image) {
      imgCol.innerHTML = `<img class="modal-image" src="${product.image}" alt="${product.name}">`;
    } else {
      imgCol.innerHTML = `<div class="modal-image-placeholder" id="modalImagePlaceholder">${product.emoji || '\u2014'}</div>`;
    }

    // Swatches
    const swatchSection = document.getElementById('modalSwatchSection');
    const swatchContainer = document.getElementById('modalSwatches');
    if (product.colors && product.colors.length > 0) {
      swatchSection.style.display = 'block';
      swatchContainer.innerHTML = '';
      product.colors.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'modal-swatch' +
          (product.soldOutColors.includes(c.label) ? ' sold-out' : '') +
          (c.label === modalSelectedColor ? ' selected' : '');
        btn.style.background = c.hex;
        btn.title = c.label;
        btn.addEventListener('click', () => {
          if (product.soldOutColors.includes(c.label)) return;
          modalSelectedColor = c.label;
          swatchContainer.querySelectorAll('.modal-swatch').forEach(s => s.classList.remove('selected'));
          btn.classList.add('selected');
        });
        swatchContainer.appendChild(btn);
      });
    } else {
      swatchSection.style.display = 'none';
    }

    // Sizes
    const sizeSection = document.getElementById('modalSizeSection');
    const sizeContainer = document.getElementById('modalSizes');
    if (product.sizes && product.sizes.length > 0) {
      sizeSection.style.display = 'block';
      sizeContainer.innerHTML = '';
      product.sizes.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'size-btn' +
          (product.soldOutSizes.includes(s) ? ' sold-out' : '') +
          (s === modalSelectedSize ? ' selected' : '');
        btn.textContent = s;
        btn.addEventListener('click', () => {
          if (product.soldOutSizes.includes(s)) return;
          modalSelectedSize = s;
          sizeContainer.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
        });
        sizeContainer.appendChild(btn);
      });
    } else {
      sizeSection.style.display = 'none';
    }

    // Specs
    const specsContainer = document.getElementById('modalSpecsContainer');
    const specsList = document.getElementById('modalSpecsList');
    if (product.specs && product.specs.length > 0) {
      specsContainer.style.display = 'block';
      specsList.innerHTML = product.specs.map(([k, v]) =>
        `<dt>${k}</dt><dd>${v}</dd>`
      ).join('');
    } else {
      specsContainer.style.display = 'none';
    }

    modalOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    modalOverlay.classList.remove('open');
    document.body.style.overflow = '';
    modalProduct = null;
  }

  modalClose.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', e => {
    if (e.target === modalOverlay) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (modalOverlay.classList.contains('open')) closeModal();
      else if (cartDrawer.classList.contains('open')) closeCart();
    }
  });

  modalAddBtn.addEventListener('click', () => {
    if (!modalProduct) return;
    addToCart(modalProduct, modalSelectedColor, modalSelectedSize);
    closeModal();
    openCart();
  });

  checkoutBtn.addEventListener('click', () => {
    alert('Checkout coming soon.');
  });

  /* ── Init ── */
  buildFilters();
  renderProducts();
  updateCartUI();
  </script>
