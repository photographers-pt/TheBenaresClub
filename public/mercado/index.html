<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercado — The Benares Club</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .mercado-page {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 2rem 8rem;
    }

    .coming-label {
      font-family: var(--font-family);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-muted);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 0.7rem 1.75rem;
      display: inline-block;
    }

    .mercado-hint {
      margin-top: 2rem;
      font-family: var(--font-family);
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.7;
    }

    .mercado-hint a {
      color: var(--text-secondary);
      text-decoration: none;
      border-bottom: 1px solid var(--border-strong);
      transition: color 0.2s, border-color 0.2s;
    }

    .mercado-hint a:hover {
      color: var(--text-primary);
      border-color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div id="grain"></div>
  <div id="header-container"></div>

  <main>
    <div class="page-banner">
      <img src="/media/banners/mercado.png" alt="" class="page-banner-img">
      <div class="page-banner-title">
        <span class="page-banner-eyebrow">The Benares Club</span>
        <h1 class="page-banner-heading">Mercado</h1>
      </div>
    </div>

    <div class="mercado-page">
      <span class="coming-label">Coming Soon</span>
      <p class="mercado-hint">
        Em breve teremos produtos disponíveis.<br>
        Segue-nos no <a href="https://www.instagram.com/thebenaresclub" target="_blank" rel="noopener">Instagram</a> para saber quando abrimos.
      </p>
    </div>
  </main>

  <div id="footer-container"></div>
  <script src="/shared.js"></script>
</body>
</html>
